language = "C"
header = "/* Auto-generated by cbindgen — do not edit by hand. */"
include_guard = "OWNAUDIO_MT3_FFI_H"
autogen_warning = "/* Warning: this file is auto-generated from Rust source. */"
braces = "SameLine"
line_length = 100
tab_width = 4
documentation = true
usize_is_size_t = true

[export]
include = [
    "Mt3ErrorCode",
    "NativeMt3Note",
    "NativeMt3Options",
    "Mt3TranscriberHandle",
]

[fn]
must_use = "[[nodiscard]]"
