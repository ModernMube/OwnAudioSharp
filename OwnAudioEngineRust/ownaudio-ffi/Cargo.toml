[package]
name = "ownaudio-ffi"
version = "0.1.0"
edition = "2021"
description = "C ABI FFI layer for OwnAudioSharp (wraps ownaudio-core)"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "ownaudio_ffi"

[features]
default = []
# Enable Windows ASIO host API support.
# Requires ASIO_SDK_DIR env var pointing to the extracted Steinberg ASIO SDK root.
# The SDK is available under a dual licence (proprietary + GPLv2).
# See: https://www.steinberg.net/developers/
asio = ["cpal/asio"]
# Links the MIDI FFI (ownaudio_midi_* exports) into this library. The iOS builds turn it on:
# there both ship as static archives, and two of them would each carry a Rust std and clash in
# the app's link. Desktop and Android keep the separate ownaudio_midi_ffi library.
midi = ["dep:ownaudio-midi-ffi"]

[dependencies]
ownaudio-core = { path = "../ownaudio-core" }
ownaudio-soundtouch = { path = "../ownaudio-soundtouch" }
cpal = "0.18"
ownaudio-midi-ffi = { path = "../../OwnAudio/Midi/rust-midi/ownaudio-midi-ffi", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"

[build-dependencies]
cbindgen = "0.27"
