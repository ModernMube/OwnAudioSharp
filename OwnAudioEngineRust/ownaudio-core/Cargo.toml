[package]
name = "ownaudio-core"
version = "0.1.0"
edition = "2021"
description = "Cross-platform audio I/O core for OwnAudioSharp (Cpal-based)"
license = "MIT"

[lib]
# cdylib only comes in at the FFI layer, not here
crate-type = ["lib"]

[dependencies]
cpal = "0.18"
thiserror = "1.0"
rtrb = "0.3"
rubato = { version = "0.15", features = ["fft_resampler"] }
log = "0.4"
ownaudio-soundtouch = { path = "../ownaudio-soundtouch" }

# Pure-Rust streaming audio decoder. Always compiled in and dependency-free at
# runtime, so the native library loads on every platform without FFmpeg.
# This is the only decoder in the product - the managed side has no FFmpeg
# fallback behind it since 4.0.
symphonia = { version = "0.5", features = [
    "mp3", "flac", "wav", "pcm", "adpcm", "ogg", "vorbis", "aac", "alac", "isomp4", "aiff",
] }

[dev-dependencies]
# Only the dsp_contract test reads the shared OwnAudioTests/dsp-contract.json spec;
# this never reaches the shipped cdylib.
serde_json = "1.0"
